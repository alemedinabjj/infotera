name: keep-api-warm

# O plano gratuito do Render dorme após ~15 min sem tráfego e o primeiro acesso leva ~1 min.
# Este ping mantém a mock-api acordada só em horário comercial de Brasília
# (seg–sex, 08:00–18:00 BRT = 11:00–21:00 UTC; Brasil sem horário de verão).
on:
  schedule:
    - cron: "*/10 11-20 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-api-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping mock-api
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 \
            --write-out "HTTP %{http_code} em %{time_total}s\n" \
            "https://infotera-mock-api.onrender.com/hotels?_limit=1"
